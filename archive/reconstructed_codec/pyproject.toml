[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfcgs-hybrid-codec"
version = "0.1.0"
description = "Artifact-driven reconstruction of the NFC-GS observable low-rank 1D codec"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "compressai>=1.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

