# GlobalSplat-32K with the archived rank-56 NFC-GS observable codec boundary.
name: globalsplat
sh_degree: 3
static_only: true

patch_size: 8
latent_rep_token_amount: 4096
dim_latents: 512
dim_rays: 256
dim_rgb_feat: 512
rounds: 4
slot_calib_layers_per_round: 2
M_max: 16
use_camera_diff_as_input: false
freeze_globalsplat: false
feature_codec_train_scope: all

feature_codec:
  geometry_observable_channels: 224
  rank: 56
  residual_N: 192
  residual_M: 320
  adapter_hidden: 96
  morton_bits: 10
  use_morton: true
  use_residual: true
  transform: linear
  transform_hidden: 32
  score_mean_condition: false
  score_channel_context: false
  score_spatial_context: false
  score_spatial_predictor: linear
  score_spatial_entropy: shared
  score_spatial_hidden: 32
  score_slice_channels: 16
  score_context_hidden: 64
