# Deterministic, index-free evaluation over every processable RE10K test scene.
# Unlike the standard fixed C3G index, this does not drop scenes missing from a
# pre-generated JSON. Context and target views are disjoint.
defaults:
  - re10k

num_context_views: 12
num_target_views: 8
eval_index_path: null
eval_all_scenes: true
augment: false
