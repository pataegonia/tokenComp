# @package _global_
defaults:
  - override /model: globalsplat_hyper1d
  - override /dataset: re10k_nfcgs_paper_train
  - override /loss: nfcgs_codec_rd_subset

experiment_name: hyper1d_12h
seed: 111123
curriculum:
  boundaries: [0, 0, 0]
  ramp_iters: 0
  final_stage: 3
optimizer:
  name: adam
  lr: 1.0e-4
  weight_decay: 0.0
  batch_size: 2
  num_workers: 8
  prefetch_factor: 2
  lr_milestones: []
  warmup_pct: 0.0625  # 1000 / 16000 optimizer steps
  min_lr_ratio: 1.0  # constant after warmup
  quantile_training: deterministic
trainer:
  devices: 1
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  max_steps: 16000
  max_time: '00:11:00:00'
  reset_time_on_resume: true
  log_every_n_steps: 20
  accumulate_grad_batches: 4
  gradient_clip_val: 0.5
  precision: bf16-mixed
  check_val_every_n_epoch: null
  val_check_interval: 8000  # batches, 2000 updates with accumulation=4
  limit_val_batches: 128
  num_sanity_val_steps: 0
checkpointing:
  auto_resume: false
  every_n_train_steps: 2000
  save_top_k: -1
  save_on_train_end: true
validation:
  fixed_scenes: true
  context_views: 12
  target_views: 8
  actual_bitstream: true
  diagnostics: true
  output_path: ./outputs/hyper1d_validation
  run_on_train_end: true
