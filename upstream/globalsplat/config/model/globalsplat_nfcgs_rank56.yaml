# Main codec: minimal linear rank56 / Hilbert + D4 Score context / 1-D residual hyperprior.
name: globalsplat
sh_degree: 3
static_only: true

patch_size: 8
latent_rep_token_amount: 4096
dim_latents: 512
dim_rays: 256
dim_rgb_feat: 512
rounds: 4
slot_calib_layers_per_round: 2
M_max: 16
use_camera_diff_as_input: false
freeze_globalsplat: true
feature_codec_train_scope: all

feature_codec:
  geometry_observable_channels: 224
  rank: 56
  residual_N: 192
  residual_M: 320
  adapter_hidden: 96
  morton_bits: 10
  use_morton: true
  token_order: hilbert  # none | morton | hilbert | nn_xyz | nn_score; none keeps original slots
  score_order_metric: l1  # nn_score distance: l1 | l2 (Euclidean; graph backends use one GEMM)
  nn_order_backend: legacy  # legacy | row (visited vector) | knn (Numba + exact fallback) | graph (kNN lists + Hilbert jump; approximate) | graph_gemm (graph with L2-GEMM shortlist, L1 rerank)
  nn_order_candidates: 64
  nn_order_distance_device: cpu  # cpu | input (CUDA when input is CUDA); legacy requires cpu
  use_residual: true
  score_spatial_context: true  # false bypasses spatial predictors, retaining Split entropy models
  score_slice_channels: 16
  score_spatial_stages: 4
  score_spatial_kernel: 5
  score_context_schedule: dyadic4  # legacy (existing 2/3/4) | quarter2 | dyadic4 | single
